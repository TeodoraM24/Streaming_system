<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1000 750" font-family="Arial, Helvetica, sans-serif">

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f4f8"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="browserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#2d3748"/>
    </linearGradient>
    <linearGradient id="frontendGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="springGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6DB33F"/>
      <stop offset="100%" stop-color="#4a8a2a"/>
    </linearGradient>
    <linearGradient id="dockerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#d6eaf8"/>
    </linearGradient>
    <linearGradient id="pgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d6a9f"/>
      <stop offset="100%" stop-color="#1a3f63"/>
    </linearGradient>
    <linearGradient id="mongoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10a044"/>
      <stop offset="100%" stop-color="#075c27"/>
    </linearGradient>
    <linearGradient id="neo4jGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0181eb"/>
      <stop offset="100%" stop-color="#014f99"/>
    </linearGradient>
    <linearGradient id="testGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="1" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5a6a80"/>
    </marker>
    <marker id="arrowWhite" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="750" fill="url(#bgGrad)"/>

  <!-- ── Title ── -->
  <text x="500" y="42" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a202c">Streaming System — Local Development Deployment</text>
  <text x="500" y="62" text-anchor="middle" font-size="12" fill="#718096">Docker Compose  ·  PostgreSQL  ·  MongoDB  ·  Neo4j  ·  Spring Boot  ·  React + Vite</text>
  <line x1="30" y1="74" x2="970" y2="74" stroke="#c8d3df" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════
       DEVELOPER MACHINE — outer dashed border
  ══════════════════════════════════════════════ -->
  <rect x="28" y="82" width="944" height="632" rx="16" fill="white" fill-opacity="0.55" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10,5"/>
  <text x="62" y="102" font-size="11" font-weight="bold" fill="#94a3b8">DEVELOPER MACHINE</text>

  <!-- ══════════════════════════════════════════════
       BROWSER BOX
  ══════════════════════════════════════════════ -->
  <rect x="360" y="112" width="280" height="68" rx="12" fill="url(#browserGrad)" filter="url(#shadow)"/>
  <!-- browser bar dots -->
  <circle cx="386" cy="130" r="5" fill="#e53e3e"/>
  <circle cx="402" cy="130" r="5" fill="#d69e2e"/>
  <circle cx="418" cy="130" r="5" fill="#38a169"/>
  <rect x="430" y="123" width="188" height="14" rx="4" fill="#4a5568"/>
  <text x="500" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#e2e8f0">Developer Browser</text>

  <!-- Arrow: Browser → Frontend -->
  <line x1="500" y1="180" x2="500" y2="212" stroke="#5a6a80" stroke-width="2" marker-end="url(#arrowGray)"/>
  <rect x="430" y="183" width="140" height="20" rx="5" fill="#ffffffcc"/>
  <text x="500" y="197" text-anchor="middle" font-size="10" fill="#4a5568" font-weight="bold">HTTP  :5173</text>

  <!-- ══════════════════════════════════════════════
       FRONTEND BOX — React + Vite
  ══════════════════════════════════════════════ -->
  <rect x="330" y="214" width="340" height="100" rx="12" fill="url(#frontendGrad)" filter="url(#shadow)"/>
  <!-- React logo shape suggestion -->
  <ellipse cx="363" cy="252" rx="16" ry="7" fill="none" stroke="#93c5fd" stroke-width="2"/>
  <ellipse cx="363" cy="252" rx="16" ry="7" fill="none" stroke="#93c5fd" stroke-width="2" transform="rotate(60 363 252)"/>
  <ellipse cx="363" cy="252" rx="16" ry="7" fill="none" stroke="#93c5fd" stroke-width="2" transform="rotate(120 363 252)"/>
  <circle cx="363" cy="252" r="3" fill="#93c5fd"/>

  <text x="500" y="246" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">React + Vite  (Frontend)</text>
  <text x="500" y="266" text-anchor="middle" font-size="12" fill="#bfdbfe">TypeScript  ·  StreamflixUI</text>
  <line x1="350" y1="278" x2="650" y2="278" stroke="#3b82f655" stroke-width="1"/>
  <text x="500" y="294" text-anchor="middle" font-size="11" fill="#bfdbfe">npm run dev  ·  CORS origin: http://localhost:3000</text>

  <!-- Arrow: Frontend → Spring Boot -->
  <line x1="500" y1="314" x2="500" y2="346" stroke="#5a6a80" stroke-width="2" marker-end="url(#arrowGray)"/>
  <rect x="390" y="317" width="220" height="20" rx="5" fill="#ffffffcc"/>
  <text x="500" y="331" text-anchor="middle" font-size="10" fill="#4a5568" font-weight="bold">REST API  :8080  ·  JWT Auth</text>

  <!-- ══════════════════════════════════════════════
       SPRING BOOT BOX
  ══════════════════════════════════════════════ -->
  <rect x="280" y="348" width="440" height="118" rx="12" fill="url(#springGrad)" filter="url(#shadow)"/>
  <!-- Spring leaf -->
  <ellipse cx="315" cy="385" rx="10" ry="16" fill="#4a8a2a" transform="rotate(-30 315 385)"/>
  <ellipse cx="315" cy="385" rx="10" ry="16" fill="#5aad32" transform="rotate(30 315 385)"/>
  <circle cx="315" cy="385" r="4" fill="#3d7520"/>

  <text x="500" y="383" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Spring Boot Application</text>
  <text x="500" y="402" text-anchor="middle" font-size="12" fill="#d4f0b0">Java 21  ·  Spring Boot 3.2  ·  REST  ·  Spring Security</text>
  <line x1="300" y1="413" x2="700" y2="413" stroke="#6DB33F55" stroke-width="1"/>
  <text x="500" y="429" text-anchor="middle" font-size="11" fill="#c8eaa0">Controllers  ·  Services  ·  JPA / Mongo / Neo4j Repositories</text>
  <text x="500" y="447" text-anchor="middle" font-size="11" fill="#c8eaa0">mvn spring-boot:run  ·  Port 8080</text>

  <!-- ══════════════════════════════════════════════
       ARROWS: Spring Boot → Docker DB containers
  ══════════════════════════════════════════════ -->

  <!-- Arrow → PostgreSQL -->
  <path d="M 375 466 C 340 490, 240 500, 195 516" fill="none" stroke="#5a6a80" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#arrowGray)"/>
  <rect x="238" y="480" width="126" height="19" rx="5" fill="#ffffffcc"/>
  <text x="301" y="494" text-anchor="middle" font-size="10" fill="#4a5568" font-weight="bold">JDBC  :5432</text>

  <!-- Arrow → MongoDB -->
  <line x1="500" y1="466" x2="500" y2="516" stroke="#5a6a80" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#arrowGray)"/>
  <rect x="421" y="478" width="158" height="19" rx="5" fill="#ffffffcc"/>
  <text x="500" y="492" text-anchor="middle" font-size="10" fill="#4a5568" font-weight="bold">MongoClient  :27017</text>

  <!-- Arrow → Neo4j -->
  <path d="M 625 466 C 660 490, 760 500, 805 516" fill="none" stroke="#5a6a80" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#arrowGray)"/>
  <rect x="636" y="480" width="128" height="19" rx="5" fill="#ffffffcc"/>
  <text x="700" y="494" text-anchor="middle" font-size="10" fill="#4a5568" font-weight="bold">Bolt  :7687</text>

  <!-- ══════════════════════════════════════════════
       DOCKER ENGINE BOX
  ══════════════════════════════════════════════ -->
  <rect x="45" y="504" width="910" height="192" rx="14" fill="url(#dockerGrad)" stroke="#2496ed" stroke-width="2"/>

  <!-- Docker logo text + whale icon suggestion -->
  <rect x="58" y="512" width="130" height="26" rx="6" fill="#2496ed"/>
  <text x="123" y="530" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Docker Compose</text>

  <!-- Whale body hint -->
  <ellipse cx="840" cy="520" rx="22" ry="12" fill="#2496ed" fill-opacity="0.25"/>
  <rect x="820" y="513" width="44" height="14" rx="4" fill="#2496ed" fill-opacity="0.18"/>

  <!-- ─── PostgreSQL Container ─── -->
  <rect x="62" y="546" width="268" height="136" rx="10" fill="url(#pgGrad)" filter="url(#shadow)"/>
  <!-- container header -->
  <rect x="62" y="546" width="268" height="34" rx="10" fill="#1a3f63"/>
  <rect x="62" y="566" width="268" height="14" fill="#1a3f63"/>
  <text x="196" y="568" text-anchor="middle" font-size="11" font-weight="bold" fill="#7B47CC">image: postgres:16-alpine</text>
  <!-- cylinder icon -->
  <ellipse cx="94" cy="606" rx="14" ry="5" fill="#1a3f63"/>
  <rect x="80" y="601" width="28" height="18" fill="#2458a0"/>
  <ellipse cx="94" cy="601" rx="14" ry="5" fill="#4a90d9"/>

  <text x="196" y="601" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">PostgreSQL</text>
  <text x="196" y="619" text-anchor="middle" font-size="11" fill="#93c5e8">Port: 5432 : 5432</text>
  <line x1="78" y1="630" x2="314" y2="630" stroke="#4a90d933" stroke-width="1"/>
  <text x="196" y="646" text-anchor="middle" font-size="10" fill="#bddcf5">volume: postgres_data</text>
  <text x="196" y="662" text-anchor="middle" font-size="10" fill="#bddcf5">db: streaming_db</text>

  <!-- ─── MongoDB Container ─── -->
  <rect x="366" y="546" width="268" height="136" rx="10" fill="url(#mongoGrad)" filter="url(#shadow)"/>
  <rect x="366" y="546" width="268" height="34" rx="10" fill="#075c27"/>
  <rect x="366" y="566" width="268" height="14" fill="#075c27"/>
  <text x="500" y="568" text-anchor="middle" font-size="11" font-weight="bold" fill="#4ade80">image: mongo:7</text>
  <!-- cylinder icon -->
  <ellipse cx="398" cy="606" rx="14" ry="5" fill="#075c27"/>
  <rect x="384" y="601" width="28" height="18" fill="#0a8038"/>
  <ellipse cx="398" cy="601" rx="14" ry="5" fill="#13c455"/>

  <text x="500" y="601" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">MongoDB</text>
  <text x="500" y="619" text-anchor="middle" font-size="11" fill="#86efac">Port: 27017 : 27017</text>
  <line x1="382" y1="630" x2="618" y2="630" stroke="#13c45533" stroke-width="1"/>
  <text x="500" y="646" text-anchor="middle" font-size="10" fill="#bbf7d0">volume: mongo_data</text>
  <text x="500" y="662" text-anchor="middle" font-size="10" fill="#bbf7d0">db: streaming_mongo</text>

  <!-- ─── Neo4j Container ─── -->
  <rect x="670" y="546" width="268" height="136" rx="10" fill="url(#neo4jGrad)" filter="url(#shadow)"/>
  <rect x="670" y="546" width="268" height="34" rx="10" fill="#014f99"/>
  <rect x="670" y="566" width="268" height="14" fill="#014f99"/>
  <text x="804" y="568" text-anchor="middle" font-size="11" font-weight="bold" fill="#60a5fa">image: neo4j:5</text>
  <!-- graph icon -->
  <circle cx="703" cy="605" r="6" fill="#0076d6"/>
  <circle cx="718" cy="615" r="5" fill="#0076d6"/>
  <circle cx="693" cy="616" r="5" fill="#0076d6"/>
  <line x1="703" y1="605" x2="718" y2="615" stroke="#80c8ff" stroke-width="1.5"/>
  <line x1="703" y1="605" x2="693" y2="616" stroke="#80c8ff" stroke-width="1.5"/>

  <text x="804" y="601" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Neo4j</text>
  <text x="804" y="619" text-anchor="middle" font-size="11" fill="#93c5fd">Port: 7687 (Bolt)  ·  7474 (UI)</text>
  <line x1="686" y1="630" x2="922" y2="630" stroke="#0095ff33" stroke-width="1"/>
  <text x="804" y="646" text-anchor="middle" font-size="10" fill="#c0d9ff">volume: neo4j_data</text>
  <text x="804" y="662" text-anchor="middle" font-size="10" fill="#c0d9ff">NEO4J_AUTH: neo4j/password</text>

  <!-- ══════════════════════════════════════════════
       TESTCONTAINERS BADGE (bottom-right corner)
  ══════════════════════════════════════════════ -->
  <rect x="660" y="706" width="310" height="54" rx="10" fill="url(#testGrad)" fill-opacity="0.9" filter="url(#shadow)"/>
  <text x="815" y="726" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Testcontainers (JUnit Tests)</text>
  <text x="815" y="743" text-anchor="middle" font-size="10" fill="#e9d5ff">Auto-spins postgres:16-alpine  ·  No manual setup needed</text>

  <!-- ══════════════════════════════════════════════
       FOOTER
  ══════════════════════════════════════════════ -->
  <line x1="30" y1="700" x2="640" y2="700" stroke="#c8d3df" stroke-width="1"/>
  <text x="330" y="718" text-anchor="middle" font-size="11" fill="#8a9ab0">Streaming System  ·  Semester 1 Software  ·  Local Development Diagram</text>
  <text x="330" y="732" text-anchor="middle" font-size="10" fill="#a0aec0">docker compose up -d  ·  mvn spring-boot:run  ·  npm run dev</text>

</svg>
